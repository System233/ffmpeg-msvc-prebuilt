name: Build FFmpeg Master

on:
  push:
    branches: [main]
    paths: ['ffmpeg/master.yaml']
  # Scheduled master builds are part of build-all's one-version-per-day
  # rotation, not an independent second weekly release.
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      sha512: ${{ steps.source.outputs.sha512 }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Resolve FFmpeg master source
        id: source
        run: python -m ffbuild.master

  build:
    needs: source
    uses: ./.github/workflows/build-release.yml
    with:
      yaml: master
      ref: ${{ needs.source.outputs.ref }}
      sha512: ${{ needs.source.outputs.sha512 }}
      commit: ${{ needs.source.outputs.commit }}
      dry_run: ${{ github.event_name == 'push' }}
    secrets: inherit
