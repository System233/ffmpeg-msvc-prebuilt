name: Build FFmpeg Master

on:
  push:
    branches: [main]
    paths: ['ffmpeg/master.yaml']
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      sha512: ${{ steps.source.outputs.sha512 }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Resolve FFmpeg master source
        id: source
        run: python -m ffbuild master-metadata

  build:
    needs: source
    uses: ./.github/workflows/build-release.yml
    with:
      yaml: master
      ref: ${{ needs.source.outputs.ref }}
      sha512: ${{ needs.source.outputs.sha512 }}
    secrets: inherit
