name: FFmpeg Auto-Heal

on:
  workflow_run:
    workflows: [Build All FFmpeg Versions, Build FFmpeg Release, Build FFmpeg Master]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        description: Completed FFmpeg build run ID
      attempt:
        type: string
        required: false
        description: Optional run attempt (default latest)

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: autoheal-run-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.attempt || 'latest' }}
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' || ((github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule') && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.analyze.outputs.matrix }}
      has_repairs: ${{ steps.analyze.outputs.has_repairs }}
      bot_pr: ${{ steps.analyze.outputs.bot_pr }}
      bot_branch: ${{ steps.analyze.outputs.bot_branch }}
      bot_target: ${{ steps.analyze.outputs.bot_target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Fetch failed run, native ABI plan, jobs and build logs
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
        shell: bash
        run: |
          args=(--run-id "$RUN_ID" --output autoheal-triage.json --github-output)
          if [[ -n "$ATTEMPT" ]]; then args+=(--attempt "$ATTEMPT"); fi
          python -m ffbuild autoheal triage "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: autoheal-triage-a${{ github.run_attempt }}
          path: autoheal-triage.json
          retention-days: 7

  repair:
    needs: [triage, sync-pr]
    if: ${{ always() && needs.triage.outputs.has_repairs == 'true' && (needs.sync-pr.result == 'success' || needs.sync-pr.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.matrix) }}
    concurrency:
      group: autoheal-repair-${{ matrix.yaml }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    env:
      FFBUILD_REPAIR_BUDGET_SECONDS: '10800'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage-a${{ github.run_attempt }}
      - uses: ./.github/actions/setup-vcpkg
        id: config
      - uses: ./.github/actions/prepare-repair
        id: source
        with:
          target: ${{ matrix.yaml }}
          cache-dir: ${{ steps.config.outputs.cache_dir }}
          downloads-dir: ${{ steps.config.outputs.downloads_dir }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Pi
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/ffbuild/pi" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.0.0
      - name: Repair and validate candidate for feedback
        env:
          FFBUILD_REPAIR_TARGET: ${{ matrix.yaml }}
          FFBUILD_REPAIR_BASE: ${{ steps.source.outputs.base }}
          FFBUILD_REPAIR_CONTEXT_SHA256: ${{ steps.source.outputs.context_sha256 }}
          FFBUILD_REPAIR_CONTRACT_SHA256: ${{ steps.source.outputs.contract_sha256 }}
          FFBUILD_PI_PACKAGE: ${{ runner.temp }}/ffbuild/pi/node_modules/@earendil-works/pi-coding-agent
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        shell: pwsh
        run: |
          python -m ffbuild autoheal repair --triage autoheal-triage.json --yaml $env:FFBUILD_REPAIR_TARGET --output repair-output
      - uses: actions/upload-artifact@v6
        with:
          name: autoheal-proposal-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: repair-output/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-abi-repair-proposal-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: ${{ steps.config.outputs.repair_dir }}/abi-evidence/
          retention-days: 7
          if-no-files-found: ignore

  verify:
    needs: [triage, repair]
    if: ${{ !cancelled() && needs.repair.result == 'success' && needs.triage.outputs.has_repairs == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage-a${{ github.run_attempt }}
      - uses: ./.github/actions/setup-vcpkg
        id: config
        with:
          bootstrap: 'false'
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-proposal-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: ${{ steps.config.outputs.repair_dir }}-proposal
      - name: Validate proposal identity and decline status
        id: proposal
        shell: pwsh
        env:
          TARGET_YAML: ${{ matrix.yaml }}
          PROPOSAL: ${{ steps.config.outputs.repair_dir }}-proposal
          VERIFIED: ${{ steps.config.outputs.repair_dir }}-verified
        run: |
          python -m ffbuild autoheal verify --triage autoheal-triage.json --yaml $env:TARGET_YAML --proposal $env:PROPOSAL --output $env:VERIFIED --inspect --github-output
      - uses: ./.github/actions/vcpkg-bootstrap
        if: steps.proposal.outputs.has_candidate == 'true'
        with:
          tag: ${{ steps.config.outputs.vcpkg_tag }}
          vcpkg-root: ${{ steps.config.outputs.vcpkg_root }}
      - uses: ./.github/actions/prepare-repair
        id: source
        if: steps.proposal.outputs.has_candidate == 'true'
        with:
          target: ${{ matrix.yaml }}
          cache-dir: ${{ steps.config.outputs.cache_dir }}
          downloads-dir: ${{ steps.config.outputs.downloads_dir }}
      - name: Clean-build exact candidate on fresh Runner
        if: steps.proposal.outputs.has_candidate == 'true'
        shell: pwsh
        env:
          FFBUILD_REPAIR_TARGET: ${{ matrix.yaml }}
          FFBUILD_REPAIR_BASE: ${{ steps.source.outputs.base }}
          FFBUILD_REPAIR_CONTEXT_SHA256: ${{ steps.source.outputs.context_sha256 }}
          FFBUILD_REPAIR_CONTRACT_SHA256: ${{ steps.source.outputs.contract_sha256 }}
          PROPOSAL: ${{ steps.config.outputs.repair_dir }}-proposal
          VERIFIED: ${{ steps.config.outputs.repair_dir }}-verified
        run: |
          python -m ffbuild autoheal verify --triage autoheal-triage.json --yaml $env:FFBUILD_REPAIR_TARGET --proposal $env:PROPOSAL --output $env:VERIFIED
      - uses: actions/upload-artifact@v6
        with:
          name: autoheal-patch-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: ${{ steps.config.outputs.repair_dir }}-verified/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-abi-repair-patch-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: ${{ steps.config.outputs.repair_dir }}/abi-evidence/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    needs: [triage, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.triage.outputs.has_repairs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage-a${{ github.run_attempt }}
      - uses: actions/download-artifact@v8
        id: candidate
        continue-on-error: true
        with:
          name: autoheal-patch-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: repair-output
      - uses: ./.github/actions/setup-python
        if: ${{ steps.candidate.outcome == 'success' }}
        with:
          requirements: requirements.txt
      - name: Review exact candidate without executing it
        if: ${{ steps.candidate.outcome == 'success' }}
        env:
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL }}
          TARGET_YAML: ${{ matrix.yaml }}
        run: |
          python -m ffbuild autoheal audit --triage autoheal-triage.json --yaml "$TARGET_YAML" --output repair-output --audit-output audit-output
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.candidate.outcome == 'success' }}
        with:
          name: autoheal-audit-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: audit-output/
          retention-days: 7
          if-no-files-found: error

  deliver:
    needs: [triage, verify, audit]
    # A failed audit job (including duplicate artifact upload) must never authorize delivery.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.audit.result == 'success' && needs.triage.outputs.has_repairs == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.matrix) }}
    concurrency:
      group: autoheal-pr-state-${{ matrix.yaml }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage-a${{ github.run_attempt }}
      - uses: actions/download-artifact@v8
        id: candidate
        continue-on-error: true
        with:
          name: autoheal-patch-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: repair-output
      - uses: ./.github/actions/setup-python
        if: ${{ steps.candidate.outcome == 'success' }}
        with:
          requirements: requirements.txt
      - uses: actions/download-artifact@v8
        id: audit
        if: ${{ steps.candidate.outcome == 'success' }}
        continue-on-error: true
        with:
          name: autoheal-audit-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.signature }}
          path: audit-output
      - name: Require exact independent approval before write credentials
        id: gate
        if: ${{ steps.candidate.outcome == 'success' }}
        env:
          TARGET_YAML: ${{ matrix.yaml }}
        run: |
          python -m ffbuild autoheal audit-gate --triage autoheal-triage.json --yaml "$TARGET_YAML" --output repair-output --audit-output audit-output --github-output
      - uses: actions/create-github-app-token@v3
        if: ${{ steps.gate.outputs.approved == 'true' }}
        id: bot
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Validate patch and synchronize bot PR
        if: ${{ steps.gate.outputs.approved == 'true' }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TARGET_YAML: ${{ matrix.yaml }}
        run: |
          python -m ffbuild autoheal deliver \
            --triage autoheal-triage.json --yaml "$TARGET_YAML" \
            --output repair-output --audit-output audit-output

  sync-pr:
    needs: triage
    if: ${{ needs.triage.outputs.bot_pr != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: autoheal-pr-state-${{ needs.triage.outputs.bot_target }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage-a${{ github.run_attempt }}
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Synchronize PR description and CI status comment
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: python -m ffbuild autoheal sync-pr --triage autoheal-triage.json
