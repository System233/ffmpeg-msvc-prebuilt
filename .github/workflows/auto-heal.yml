name: OpenCode Auto-Heal

on:
  workflow_run:
    workflows: [Build All FFmpeg Versions, Build FFmpeg Release, Build FFmpeg Master]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        description: Completed FFmpeg build run ID
      attempt:
        type: string
        required: false
        description: Optional run attempt (default latest)

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: autoheal-run-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.attempt || 'latest' }}
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' || ((github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule') && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.analyze.outputs.matrix }}
      has_repairs: ${{ steps.analyze.outputs.has_repairs }}
      bot_pr: ${{ steps.analyze.outputs.bot_pr }}
      bot_branch: ${{ steps.analyze.outputs.bot_branch }}
      bot_target: ${{ steps.analyze.outputs.bot_target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Fetch failed run, native ABI plan, jobs and build logs
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
        shell: bash
        run: |
          args=(--run-id "$RUN_ID" --output autoheal-triage.json --github-output)
          if [[ -n "$ATTEMPT" ]]; then args+=(--attempt "$ATTEMPT"); fi
          python -m ffbuild autoheal triage "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: autoheal-triage
          path: autoheal-triage.json
          retention-days: 7

  repair:
    needs: [triage, sync-pr]
    if: ${{ always() && needs.triage.outputs.has_repairs == 'true' && (needs.sync-pr.result == 'success' || needs.sync-pr.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.matrix) }}
    concurrency:
      group: autoheal-repair-${{ matrix.yaml }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    env:
      OPENCODE_VERSION: '1.17.9'
      OPENCODE_SHA256: '85aeac95258d409d16ca34f1cfcd74c78d9d1a70b0a4154128b588e1405384f9'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Fetch trusted OpenCode knowledge
        run: |
          git fetch origin opencode --depth 1
          mkdir -p .opencode
          git archive FETCH_HEAD | tar -x -C .opencode
      - name: Install pinned OpenCode
        run: |
          curl -fsSL -o /tmp/opencode.tar.gz \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "$OPENCODE_SHA256  /tmp/opencode.tar.gz" | sha256sum -c -
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mkdir -p "$HOME/.opencode/bin"
          mv /tmp/opencode "$HOME/.opencode/bin/opencode"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Produce version-scoped repair patch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_YAML: ${{ matrix.yaml }}
          OPCODE_MODEL: ${{ secrets.OPCODE_MODEL || 'opencode/deepseek-v4-flash-free' }}
          OPCODE_API_KEY: ${{ secrets.OPCODE_API_KEY }}
        run: |
          python -m ffbuild autoheal repair \
            --triage autoheal-triage.json --yaml "$TARGET_YAML" \
            --output repair-output
      - uses: actions/upload-artifact@v6
        with:
          name: autoheal-patch-${{ matrix.yaml }}-${{ matrix.signature }}
          path: repair-output/
          retention-days: 7
          if-no-files-found: error

  deliver:
    needs: [triage, repair]
    if: ${{ always() && needs.triage.outputs.has_repairs == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.matrix) }}
    concurrency:
      group: autoheal-pr-state-${{ matrix.yaml }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-patch-${{ matrix.yaml }}-${{ matrix.signature }}
          path: repair-output
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Validate patch and synchronize bot PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TARGET_YAML: ${{ matrix.yaml }}
        run: |
          python -m ffbuild autoheal deliver \
            --triage autoheal-triage.json --yaml "$TARGET_YAML" \
            --output repair-output

  sync-pr:
    needs: triage
    if: ${{ needs.triage.outputs.bot_pr != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: autoheal-pr-state-${{ needs.triage.outputs.bot_target }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: autoheal-triage
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Synchronize PR description and CI status comment
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: python -m ffbuild autoheal sync-pr --triage autoheal-triage.json
