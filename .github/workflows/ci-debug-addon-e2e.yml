name: FFmpeg CMake Cached Native E2E
on:
  push:
    branches: [ci/debug-addon-e2e-20261126]
permissions:
  contents: read
  actions: read
concurrency:
  group: cached-native-build-validation
  cancel-in-progress: false
jobs:
  validate:
    name: Windows MSVC contracts
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: ./.github/actions/vcpkg-bootstrap
        with:
          tag: 2026.06.01
          vcpkg-root: ${{ runner.temp }}/ffbuild/vcpkg
      - name: Restore existing x64 Seed for contract tools
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ffbuild/vcpkg-cache
          key: ffbuild-seed-2026.06.01-x64-windows-2b84adf9078ca2e93e1f6b7de43a2e03b1935e4447499993327cce4a587f8b13
          fail-on-cache-miss: true
      - name: Restore native pkgconf without compilation
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}/ffbuild/vcpkg
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/ffbuild/vcpkg-cache,read
        run: |
          python -m ffvcpkg install pkgconf:x64-windows --only-binarycaching --no-print-usage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkgconf = "$env:VCPKG_ROOT/installed/x64-windows/tools/pkgconf/pkgconf.exe"
          if (!(Test-Path $pkgconf)) { throw 'Native pkgconf not restored' }
          "FFBUILD_TEST_PKGCONF=$pkgconf" >> $env:GITHUB_ENV
          "FFBUILD_TEST_VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $lib = (& $vswhere -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/lib.exe' | Select-Object -First 1)
          if (!$lib -or !(Test-Path $lib)) { throw 'Native MSVC lib.exe missing' }
          "FFBUILD_TEST_LIB_EXE=$lib" >> $env:GITHUB_ENV
      - name: Set up GNU shell tools for generated Port contracts
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: make
          cache: false
      - name: Locate native shell prerequisites
        shell: msys2 {0}
        run: |
          test -x /usr/bin/bash.exe && test -x /usr/bin/make.exe
          echo "FFBUILD_TEST_BASH=$(cygpath -w /usr/bin/bash.exe)" >> "$(cygpath -u "$GITHUB_ENV")"
      - run: python -m ffbuild validate
      - name: Run unit tests outside the CMake contract tiers
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'scripts;tests'
          @'
          import pathlib
          import sys
          import unittest
          from run_cmake_contracts import QUICK, NATIVE, REAL, REAL_STATIC
          contract = set(QUICK + NATIVE + REAL + REAL_STATIC)
          modules = sorted(p.stem for p in pathlib.Path("tests").glob("test_*.py"))
          remaining = [m for m in modules if m not in contract]
          assert set(modules) == set(remaining) | contract
          suite = unittest.defaultTestLoader.loadTestsFromNames(remaining)
          if unittest.defaultTestLoader.errors:
              raise RuntimeError(unittest.defaultTestLoader.errors)
          print(f"Independent unit tests: {suite.countTestCases()} across {len(remaining)} modules", flush=True)
          sys.exit(not unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run strict parallel native MSVC contracts
        shell: pwsh
        run: |
          python tests/run_cmake_contracts.py --tier native --jobs 8 --native-jobs 4 --group-timeout 300 --report cmake-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cmake-native-contract-report
          path: cmake-native.json
          retention-days: 7
          if-no-files-found: ignore
  build:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {version: '4.4.8', triplet: x64-windows, package: 'ffmpeg[all-lgpl]', license: lgpl, linkage: shared}
          - {version: '4.4.8', triplet: x64-windows, package: 'ffmpeg[all-lgpl,static]', license: lgpl, linkage: static}
          - {version: '8.1.3', triplet: x64-windows, package: 'ffmpeg[all-gpl]', license: gpl, linkage: shared}
          - {version: '8.1.3', triplet: x86-windows, package: 'ffmpeg[all-lgpl,static]', license: lgpl, linkage: static}
    name: ${{ matrix.version }}-${{ matrix.triplet }}-${{ matrix.license }}-${{ matrix.linkage }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: ./.github/actions/vcpkg-bootstrap
        with:
          tag: 2026.06.01
          vcpkg-root: ${{ runner.temp }}/ffbuild/vcpkg
      - name: Set native environment
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:RUNNER_TEMP/ffbuild/vcpkg" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP/ffbuild/vcpkg-cache,read" >> $env:GITHUB_ENV
      - name: Generate production recipes and scan one target
        id: plan
        shell: pwsh
        run: |
          python -m ffbuild generate --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          targets:
            - {package: '${{ matrix.package }}', triplet: '${{ matrix.triplet }}'}
          '@ | Set-Content -Encoding utf8 ci-target.yaml
          python -m ffbuild scan --version "${{ matrix.version }}" --targets-file ci-target.yaml --output ffbuild-abi.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scan = Get-Content ffbuild-abi.json -Raw | ConvertFrom-Json
          if ($scan.jobs.Count -ne 1 -or $scan.blocked.Count -ne 0) { throw 'Expected one native target' }
          $job = $scan.jobs[0]
          if ($job.yaml -ne '${{ matrix.version }}' -or $job.triplet -ne '${{ matrix.triplet }}' -or $job.license -ne '${{ matrix.license }}' -or $job.linkage -ne '${{ matrix.linkage }}') { throw 'Unexpected target' }
          "job=$($job | ConvertTo-Json -Depth 100 -Compress)" >> $env:GITHUB_OUTPUT
      - name: Restore existing exact Seed from prior CI
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ffbuild/vcpkg-cache
          key: ffbuild-seed-2026.06.01-${{ matrix.triplet }}-2b84adf9078ca2e93e1f6b7de43a2e03b1935e4447499993327cce4a587f8b13
          fail-on-cache-miss: true
      - name: Verify worker vcpkg ABI equals planned ABI
        env:
          FFBUILD_JOB: ${{ steps.plan.outputs.job }}
        run: python -m ffbuild scan --job-env FFBUILD_JOB
      - name: Require exact third-party binary cache coverage
        env:
          FFBUILD_JOB: ${{ steps.plan.outputs.job }}
        run: python -m ffbuild.ci restore-dependencies --job-env FFBUILD_JOB "--cache-dir=${{ runner.temp }}/ffbuild/vcpkg-cache"
      - name: Build and test via native vcpkg
        id: native-build
        env:
          FFBUILD_JOB: ${{ steps.plan.outputs.job }}
        shell: pwsh
        run: |
          $job = $env:FFBUILD_JOB | ConvertFrom-Json
          $versionPort = "_work/ffbuild/generated-ports/ffmpeg-$($job.yaml.Replace('.', '-'))"
          python -m ffvcpkg install $job.package $job.tester_port "--triplet=$($job.triplet)" `
            "--overlay-ports=$versionPort" "--overlay-ports=ports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify no external dependencies were compiled by Worker
        if: ${{ always() && steps.native-build.outcome != 'skipped' && steps.plan.outcome == 'success' }}
        env:
          FFBUILD_JOB: ${{ steps.plan.outputs.job }}
        run: python -m ffbuild.ci audit-worker --job-env FFBUILD_JOB "--buildtrees=${{ runner.temp }}/ffbuild/vcpkg/buildtrees"
      - name: Run locally installed static SDK acceptance
        if: matrix.linkage == 'static'
        shell: pwsh
        env:
          FFBUILD_TEST_MSVC: '1'
          FFBUILD_TEST_REAL_STATIC_TRIPLET: ${{ matrix.triplet }}
          FFBUILD_TEST_REAL_STATIC_PACKAGE: ${{ runner.temp }}/ffbuild/vcpkg/packages/ffmpeg_${{ matrix.triplet }}
          FFBUILD_TEST_REAL_STATIC_INSTALLED: ${{ runner.temp }}/ffbuild/vcpkg/installed/${{ matrix.triplet }}
          FFBUILD_TEST_PKGCONF: ${{ runner.temp }}/ffbuild/vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe
        run: |
          # Genuine static acceptance needs the installed SDK and native
          # compiler/pkgconf only; the strict runner rejects any skipped case.
          python tests/run_cmake_contracts.py --tier real-static --module test_cmake_real_static_sdk --jobs 2 --native-jobs 2 --group-timeout 1200 --report cmake-real-static.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and package installed vcpkg result
        env:
          FFBUILD_JOB: ${{ steps.plan.outputs.job }}
        run: python -m ffbuild package --job-env FFBUILD_JOB --port-dir "${{ runner.temp }}/ffbuild/vcpkg/packages/ffmpeg_${{ matrix.triplet }}" --installed-root "${{ runner.temp }}/ffbuild/vcpkg/installed" --buildtrees "${{ runner.temp }}/ffbuild/vcpkg/buildtrees" --output-dir Release
      - name: Validate packaged ZIPs with the publication gate
        run: python -m ffbuild publish --artifacts-dir Release --dry-run
      - name: Validate extracted public SDK and CLI
        run: python -m ffbuild.ci verify-sdk --artifacts-dir Release --pkgconf "${{ runner.temp }}/ffbuild/vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe"
      - uses: actions/upload-artifact@v6
        if: ${{ success() }}
        with:
          name: cached-native-build-${{ matrix.version }}-${{ matrix.triplet }}-${{ matrix.license }}-${{ matrix.linkage }}
          path: |
            Release/
            cmake-real-static.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: native-build-failure-logs-${{ matrix.version }}-${{ matrix.triplet }}-${{ matrix.license }}-${{ matrix.linkage }}
          path: |
            ${{ runner.temp }}/ffbuild/vcpkg/buildtrees/**/*.log
            ${{ runner.temp }}/ffbuild/vcpkg/buildtrees/**/*.err
            ffbuild-abi.json
            cmake-real-static.json
          retention-days: 3
          if-no-files-found: ignore
