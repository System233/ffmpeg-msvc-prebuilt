name: FFmpeg Debug Add-on E2E

on:
  push:
    branches: [ci/debug-addon-e2e-20261126]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - run: python -m ffbuild validate
      - run: python -m unittest discover -s tests
  e2e:
    needs: validate
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
    with:
      yaml: 8.1.3
      dry_run: true
      skip_publish: true
      skip_release: false
      force: true
