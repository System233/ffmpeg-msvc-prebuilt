# ---------------------------------------------------------------------------
# pr-build.yml — Verify builds on pull requests
#
# Triggered when a PR is opened or updated with changes to YAML specs, ports,
# or patches.  Builds the affected versions with dry_run=true so no GitHub
# Release or data-branch push occurs.
# ---------------------------------------------------------------------------

name: PR Build

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'ffmpeg/*.yaml'
      - 'ports/**'
      - 'patches/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      pr_number: ${{ steps.fork.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python
        with:
          requirements: 'requirements.txt'

      - name: Check no existing patches modified
        run: |
          MODIFIED=$(git diff --name-only --diff-filter=M \
            "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" \
            -- patches/)
          if [ -n "$MODIFIED" ]; then
            echo "::error::Modifying existing patches breaks compatibility with older versions. Only add new patches or remove them from YAML."
            echo "$MODIFIED"
            exit 1
          fi

      - name: Detect fork PR
        id: fork
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "pr_number=" >> $GITHUB_OUTPUT
            echo "Fork PR — auto-heal will be skipped"
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed versions
        id: detect
        run: |
          BEFORE="${{ github.event.pull_request.base.sha }}"
          AFTER="${{ github.event.pull_request.head.sha }}"
          echo "Base SHA: ${BEFORE}"
          echo "Head SHA: ${AFTER}"
          python scripts/ops/ci_detect_changes.py \
            --base "$BEFORE" --head "$AFTER" --json --include-master > changes.json
          cat changes.json

      - name: Build dispatch matrix
        id: set-matrix
        run: |
          include=$(jq -c '
            if .found then
              [.changed[] | {version, revision}]
            else
              []
            end
          ' changes.json)
          echo "matrix=$include" >> "$GITHUB_OUTPUT"

  # Resolve master ref/sha512 when the PR touches master.yaml — mirror of
  # master-build.yml get-metadata.  Job always runs (build depends on it);
  # the step is skipped when the matrix has no master.
  master-metadata:
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.describe }}
      sha512: ${{ steps.meta.outputs.sha512 }}
    steps:
      - name: Get master build metadata
        id: meta
        if: ${{ contains(needs.detect.outputs.matrix, '"master"') }}
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          DESCRIBE=$(git -C ffmpeg-src describe --tags --abbrev=7)
          COMMIT=$(git -C ffmpeg-src rev-parse HEAD)
          SHA512=$(curl -sL "https://github.com/FFmpeg/FFmpeg/archive/${COMMIT}.tar.gz" | sha512sum | cut -d' ' -f1)
          echo "describe=$DESCRIBE" >> "$GITHUB_OUTPUT"
          echo "sha512=$SHA512" >> "$GITHUB_OUTPUT"

  seed-setup:
    uses: ./.github/workflows/seed-setup.yml
    with:
      name: pr

  build:
    needs: [seed-setup, detect, master-metadata]
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/build-release.yml
    with:
      yaml: ${{ matrix.version }}
      ref: ${{ matrix.version == 'master' && needs.master-metadata.outputs.ref || '' }}
      sha512: ${{ matrix.version == 'master' && needs.master-metadata.outputs.sha512 || '' }}
      dry_run: true
      pr_number: ${{ needs.detect.outputs.pr_number }}
      skip_seed: true
    secrets: inherit

  all-checks-passed:
      name: all-checks-passed
      runs-on: ubuntu-latest
      needs: build
      if: always()
      steps:
        - name: Check Matrix Status
          run: |
            if [ "${{ needs.build.result }}" = "success" ]; then
              echo "All Matrix builds passed successfully!"
            else
              echo "Matrix builds failed or were skipped — PR requires at least one build!"
              exit 1
            fi
