name: Build FFmpeg Release

on:
  workflow_dispatch:
    inputs:
      yaml:
        description: "FFmpeg YAML version (or master)"
        required: true
        type: string
      ref:
        description: "Pinned upstream snapshot describe ref"
        type: string
      sha512:
        description: "Pinned upstream tarball SHA512"
        type: string
      target_arch:
        description: "Optional vcpkg triplet"
        type: string
      target_license:
        description: "Optional license variant"
        type: string
      dry_run:
        type: boolean
        default: false
      history:
        type: boolean
        default: false
      shard_count:
        type: number
        default: 1
      shard_index:
        type: number
        default: 0
  workflow_call:
    inputs:
      yaml:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      sha512:
        type: string
        required: false
        default: ""
      target_arch:
        type: string
        required: false
        default: ""
      target_license:
        type: string
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      triplets: ${{ steps.plan.outputs.triplets }}
      auto_heal_yaml: ${{ steps.plan.outputs.auto_heal_yaml }}
      auto_heal_ref: ${{ steps.plan.outputs.auto_heal_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Build plan
        id: plan
        env:
          FFBUILD_VERSION: ${{ inputs.yaml }}
          FFBUILD_REF: ${{ inputs.ref }}
          FFBUILD_SHA512: ${{ inputs.sha512 }}
          FFBUILD_TRIPLET: ${{ inputs.target_arch }}
          FFBUILD_LICENSE: ${{ inputs.target_license }}
        run: python -m ffbuild plan --event --version "$FFBUILD_VERSION" --ref "$FFBUILD_REF" --sha512 "$FFBUILD_SHA512" --triplets "$FFBUILD_TRIPLET" --licenses "$FFBUILD_LICENSE" --github-output
      - uses: actions/upload-artifact@v6
        with:
          name: ffbuild-plan
          path: ffbuild-plan.json
          retention-days: 5

  prepare:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        triplet: ${{ fromJSON(needs.plan.outputs.triplets) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: ./.github/actions/vcpkg-bootstrap
        with:
          tag: 2026.06.01
          vcpkg-root: ${{ runner.temp }}/ffbuild/vcpkg
      - uses: actions/cache@v5
        id: dependencies
        with:
          path: ${{ runner.temp }}/ffbuild/vcpkg-cache
          key: ffbuild-seed-2026.06.01-${{ matrix.triplet }}-${{ hashFiles('ports/**', 'ffmpeg/**', 'triplets/**', 'scripts/ffport/**', 'ffbuild/builder.py', 'vcpkg-configuration.json') }}
      - name: Prewarm dependent libraries
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: python -m ffbuild prepare --triplet "${{ matrix.triplet }}"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-logs-seed-${{ matrix.triplet }}
          path: ${{ runner.temp }}/ffbuild/vcpkg/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: [plan, prepare]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: ./.github/actions/vcpkg-bootstrap
        with:
          tag: 2026.06.01
          vcpkg-root: ${{ runner.temp }}/ffbuild/vcpkg
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ffbuild/vcpkg-cache
          key: ffbuild-seed-2026.06.01-${{ matrix.triplet }}-${{ hashFiles('ports/**', 'ffmpeg/**', 'triplets/**', 'scripts/ffport/**', 'ffbuild/builder.py', 'vcpkg-configuration.json') }}
      - name: Compile, test and package
        env:
          FFBUILD_JOB: ${{ toJSON(matrix) }}
        run: python -m ffbuild build --job-env FFBUILD_JOB
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.id }}
          path: |
            Release/*.zip
            Release/*.var.yaml
          retention-days: 5
          compression-level: 0
      - uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: build-logs-${{ matrix.yaml }}-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/ffbuild/vcpkg/buildtrees/**/*.log
            ${{ runner.temp }}/ffbuild/vcpkg/buildtrees/**/*.err
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' && github.event_name != 'pull_request' && !inputs.dry_run }}
    concurrency:
      group: data-branch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          ref: data
          path: data
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}
      - uses: actions/download-artifact@v8
        with:
          name: ffbuild-plan
      - uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          path: artifacts
          merge-multiple: true
      - name: Publish using existing release schema
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GIT_AUTHOR_NAME: ffmpeg-dev
          GIT_AUTHOR_EMAIL: ffmpeg-dev@users.noreply.github.com
          GIT_COMMITTER_NAME: ffmpeg-dev
          GIT_COMMITTER_EMAIL: ffmpeg-dev@users.noreply.github.com
        run: python -m ffbuild publish --artifacts-dir artifacts --data-dir data --plan-file ffbuild-plan.json

  trigger-auto-heal:
    needs: [plan, build]
    if: ${{ failure() && needs.build.result == 'failure' && needs.plan.outputs.auto_heal_yaml != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    uses: ./.github/workflows/auto-heal.yml
    with:
      yaml: ${{ needs.plan.outputs.auto_heal_yaml }}
      ref: ${{ needs.plan.outputs.auto_heal_ref }}
      pr_number: ${{ github.event.pull_request.number || '' }}
      run_id: ${{ github.run_id }}
    secrets: inherit
