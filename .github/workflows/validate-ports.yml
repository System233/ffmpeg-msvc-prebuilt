name: Validate Port Generation

on:
  push:
    branches: [main]
    paths: ['ffmpeg/**', 'patches/**', 'ports/**', 'scripts/**', 'ffbuild/**', 'triplets/**']
  pull_request:
    paths: ['ffmpeg/**', 'patches/**', 'ports/**', 'scripts/**', 'ffbuild/**', 'triplets/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - run: python -m ffbuild validate
      - run: python -m unittest discover -s tests
