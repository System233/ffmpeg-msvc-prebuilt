name: Add FFmpeg Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'FFmpeg release X.Y or X.Y.Z'
        required: true
        type: string
      sha512:
        description: 'Optional precomputed tarball checksum'
        type: string

permissions:
  contents: read

jobs:
  add-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Add upstream version
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          FFMPEG_VERSION: ${{ inputs.version }}
          FFMPEG_SHA512: ${{ inputs.sha512 }}
          GIT_AUTHOR_NAME: ffmpeg-dev[bot]
          GIT_AUTHOR_EMAIL: 295689149+ffmpeg-dev[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ffmpeg-dev[bot]
          GIT_COMMITTER_EMAIL: 295689149+ffmpeg-dev[bot]@users.noreply.github.com
        run: python -m ffbuild updates --version "$FFMPEG_VERSION" --sha512 "$FFMPEG_SHA512" --apply
