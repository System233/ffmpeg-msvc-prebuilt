name: FFmpeg CI E2E Isolated

# Only the dedicated test branch can run this workflow. Its name intentionally
# differs from the production workflow_run targets used by Auto-Heal.
on:
  push:
    branches:
      - 'ci/e2e-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    # Four deliberately distinct historical/current release families, exactly
    # one ABI-sorted MSVC variant each. Never rebuild 8.1.x in this smoke.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { yaml: '3.4.14', shard_index: 9 }  # x64 GPL shared
          - { yaml: '4.4.8', shard_index: 2 }   # ARM LGPL static
          - { yaml: '6.1.6', shard_index: 13 } # x86 GPL shared
          - { yaml: '9.1', shard_index: 6 }    # ARM64 LGPL static
    # Do not inherit production App secrets or write-capable credentials.
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
    with:
      yaml: ${{ matrix.yaml }}
      dry_run: true
      # Exercise genuine ZIP packaging, but prohibit release/data publication.
      skip_release: false
      skip_publish: true
      force: true
      # Exactly one of 16 ABI variants per FFmpeg version, never a full
      # 16-way release matrix. All Worker dependency caches must be reused.
      shard_count: 16
      shard_index: ${{ matrix.shard_index }}
