name: FFmpeg CI E2E Isolated

# Only the dedicated test branch can run this workflow. Its name intentionally
# differs from the production workflow_run targets used by Auto-Heal.
on:
  push:
    branches:
      - 'ci/e2e-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    # Final cross-family coverage: four additional variants complementary to
    # the four previously verified builds. Do not repeat 8.1.x or master.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { yaml: '5.1.10', shard_index: 10 } # x64 LGPL static
          - { yaml: '7.1.5', shard_index: 1 }   # ARM GPL shared
          - { yaml: '8.0.1', shard_index: 5 }   # ARM64 GPL shared
          - { yaml: '9.0.2', shard_index: 14 }  # x86 LGPL static
    # Do not inherit production App secrets or write-capable credentials.
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
    with:
      yaml: ${{ matrix.yaml }}
      dry_run: true
      # Exercise genuine ZIP packaging, but prohibit release/data publication.
      skip_release: false
      skip_publish: true
      force: true
      # Exactly one of 16 ABI variants per FFmpeg version, never a full
      # 16-way release matrix. All Worker dependency caches must be reused.
      shard_count: 16
      shard_index: ${{ matrix.shard_index }}
