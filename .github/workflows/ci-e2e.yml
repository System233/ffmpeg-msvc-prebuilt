name: FFmpeg CI E2E Isolated

# Only the dedicated test branch can run this workflow. Its name intentionally
# differs from the production workflow_run targets used by Auto-Heal.
on:
  push:
    branches:
      - 'ci/e2e-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - run: python -m ffbuild validate
      - run: python -m unittest discover -s tests
  smoke:
    needs: validate
    # Validate v2 license/SPDX/provenance packaging using one static LGPL and
    # one shared GPL variant already known to compile with native MSVC.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { yaml: '5.1.10', shard_index: 10 } # x64 LGPL static
          - { yaml: '7.1.5', shard_index: 1 }   # ARM GPL shared
    # Do not inherit production App secrets or write-capable credentials.
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
    with:
      yaml: ${{ matrix.yaml }}
      dry_run: true
      # Exercise genuine ZIP packaging, but prohibit release/data publication.
      skip_release: false
      skip_publish: true
      force: true
      # Exactly one of 16 ABI variants per FFmpeg version, never a full
      # 16-way release matrix. All Worker dependency caches must be reused.
      shard_count: 16
      shard_index: ${{ matrix.shard_index }}
