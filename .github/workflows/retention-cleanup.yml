# ---------------------------------------------------------------------------
# retention-cleanup.yml — Enforce retention policy on old builds
#
# Runs weekly (Sunday midnight UTC) or manually via workflow_dispatch.
# Deletes old Master GitHub Releases and their index entries; preserves every tag, according to
# the retention policy defined in ci/SPEC.md §5.
#
# SPEC: ci/SPEC.md §7.5
# ---------------------------------------------------------------------------

name: Retention Cleanup

concurrency:
  group: data-branch
  cancel-in-progress: false
  queue: max

on:
  schedule:
    - cron: '0 0 * * 0'   # Sunday midnight UTC
  workflow_dispatch:

env:
  GIT_AUTHOR_NAME: ffmpeg-dev
  GIT_AUTHOR_EMAIL: ffmpeg-dev@users.noreply.github.com
  GIT_COMMITTER_NAME: ffmpeg-dev
  GIT_COMMITTER_EMAIL: ffmpeg-dev@users.noreply.github.com

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout main branch so we have access to scripts/
      - uses: actions/checkout@v6

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write

      # Checkout data branch (Release catalog)
      - name: Checkout data branch
        id: checkout-data
        uses: actions/checkout@v6
        with:
          ref: data
          path: data
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-python
        with:
          requirements: 'requirements.txt'

      - name: Delete expired Master Releases and confirm before changing Data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/ops/retention_policy.py data --apply-remote

      # Commit and push the updated Release index after retention.
      - name: Commit and push data branch
        run: |
          python scripts/ci/push_data_branch.py \
            --message 'retention: cleanup old builds' \
            --directory data --index-only

  # ── Trigger pages rebuild ─────────────────────────────────────────────────
  trigger-pages:
    needs: cleanup
    if: success()
    uses: ./.github/workflows/pages.yml
