name: Native Dependency Seed E2E

on:
  push:
    branches: [ci/native-seed-e2e-20261128]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-seed-e2e-20261128
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.target.outputs.production }}
      version: ${{ steps.target.outputs.version }}
      date: ${{ steps.target.outputs.date }}
      ref: ${{ steps.target.outputs.ref }}
      commit: ${{ steps.target.outputs.commit }}
      sha512: ${{ steps.target.outputs.sha512 }}
    steps:
      - name: Select isolated non-publishing test target
        id: target
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/ci/native-seed-e2e-20261128
          test "$GITHUB_EVENT_NAME" = push
          echo 'production=false' >> "$GITHUB_OUTPUT"
          echo 'version=8.1.3' >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo 'ref=' >> "$GITHUB_OUTPUT"
          echo 'commit=' >> "$GITHUB_OUTPUT"
          echo 'sha512=' >> "$GITHUB_OUTPUT"

  plan:
    needs: select
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prepare_matrix: ${{ steps.plan.outputs.prepare_matrix }}
      publication_required: ${{ steps.plan.outputs.publication_required }}
      plan_attempt: ${{ steps.plan.outputs.plan_attempt }}
      download_key: ${{ steps.plan.outputs.download_key }}
      download_prefix: ${{ steps.plan.outputs.download_prefix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-vcpkg
        id: config
      - name: Restore Release catalog from data branch
        if: ${{ false }}
        uses: actions/checkout@v6
        with:
          ref: data
          path: data
      - name: Generate native build plan
        id: plan
        env:
          FFBUILD_VERSION: ${{ needs.select.outputs.version }}
          FFBUILD_DATE: ${{ needs.select.outputs.date }}
          FFBUILD_PRODUCTION: ${{ needs.select.outputs.production }}
          FFBUILD_FORCE: 'true'
          FFBUILD_REF: ${{ needs.select.outputs.ref }}
          FFBUILD_COMMIT: ${{ needs.select.outputs.commit }}
          FFBUILD_SHA512: ${{ needs.select.outputs.sha512 }}
          FFBUILD_TARGET_ARCH: ''
          FFBUILD_TARGET_LICENSE: ''
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CACHE_RECIPE: ${{ hashFiles('ports/**', '!ports/ffmpeg-tester/**', 'vcpkg-configuration.json') }}
        run: python -m ffbuild.ci plan
      - uses: actions/upload-artifact@v6
        with:
          name: ffbuild-generated-ports-a${{ github.run_attempt }}
          path: _work/ffbuild/generated-ports/
          retention-days: 5
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-abi-plan-a${{ github.run_attempt }}
          path: abi-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: ffbuild-plan-a${{ github.run_attempt }}
          path: ffbuild-plan.json
          retention-days: 30

  download:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-vcpkg
        id: config
      - uses: actions/download-artifact@v8
        with:
          name: ffbuild-generated-ports-a${{ needs.plan.outputs.plan_attempt }}
          path: _work/ffbuild/generated-ports
      - name: Restore dependency source downloads
        id: download-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.config.outputs.downloads_dir }}
          key: ${{ needs.plan.outputs.download_key }}
          restore-keys: ${{ needs.plan.outputs.download_prefix }}
      - name: Download sources once for all Triplets
        if: steps.download-cache.outputs.cache-hit != 'true'
        run: python -m ffbuild.ci download
      - name: Save consolidated dependency source downloads
        if: steps.download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.config.outputs.downloads_dir }}
          key: ${{ needs.plan.outputs.download_key }}

  prepare:
    name: prepare-${{ matrix.triplet }}
    needs: [plan, download]
    if: ${{ needs.plan.result == 'success' && needs.download.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.prepare_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-vcpkg
        id: config
      - uses: actions/download-artifact@v8
        with:
          name: ffbuild-generated-ports-a${{ needs.plan.outputs.plan_attempt }}
          path: _work/ffbuild/generated-ports
      - name: Restore shared dependency source downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.config.outputs.downloads_dir }}
          key: ${{ needs.plan.outputs.download_key }}
          fail-on-cache-miss: true
      - name: Restore previously prebuilt dependency binaries
        id: seed-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.config.outputs.cache_dir }}
          key: ${{ matrix.seed_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.seed_key }}-
            ${{ matrix.seed_key }}
            ${{ matrix.prefix }}
      - name: Prepare and verify exact dependency cache
        id: prepare-cache
        env:
          SEED_MATCHED_KEY: ${{ steps.seed-cache.outputs.cache-matched-key }}
        run: python -m ffbuild.ci prepare-cache --triplet "${{ matrix.triplet }}" --expected "${{ matrix.abi }}" "--matched-key=$env:SEED_MATCHED_KEY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-abi-seed-a${{ github.run_attempt }}-${{ matrix.triplet }}
          path: abi-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save completed shared dependency cache
        if: steps.prepare-cache.outputs.save_key != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.config.outputs.cache_dir }}
          key: ${{ steps.prepare-cache.outputs.save_key }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-logs-seed-a${{ github.run_attempt }}-${{ matrix.triplet }}
          path: |
            ${{ steps.config.outputs.vcpkg_root }}/buildtrees/**/*.log
            ${{ steps.config.outputs.vcpkg_root }}/buildtrees/**/*.err
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: ffbuild-${{ matrix.id }}
    needs: [plan, prepare]
    if: ${{ needs.plan.result == 'success' && needs.prepare.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FFBUILD_JOB: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-vcpkg
        id: config
      - uses: actions/download-artifact@v8
        with:
          name: ffbuild-generated-ports-a${{ needs.plan.outputs.plan_attempt }}
          path: _work/ffbuild/generated-ports
      - name: Restore shared dependency source downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.config.outputs.downloads_dir }}
          key: ${{ needs.plan.outputs.download_key }}
          fail-on-cache-miss: true
      - name: Restore centrally prebuilt dependencies
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.config.outputs.cache_dir }}
          key: ${{ matrix.seed_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.seed_key }}-
            ${{ matrix.seed_key }}
          fail-on-cache-miss: true
      - name: Prepare architecture-specific MSVC host
        run: python -m ffbuild.ci prepare-host --triplet "${{ matrix.triplet }}"
      - name: Require exact third-party binary cache coverage
        run: python -m ffbuild.ci restore-dependencies --abi-evidence abi-evidence/target
      - name: Build and test via native vcpkg
        id: native-build
        run: python -m ffbuild.ci worker-build
      - name: Verify no external dependencies were compiled by Worker
        if: ${{ !cancelled() && (steps.native-build.outcome == 'success' || steps.native-build.outcome == 'failure') }}
        run: python -m ffbuild.ci audit-worker
      - name: Validate independent installed SDK consumers
        if: ${{ matrix.linkage == 'static' }}
        run: python -m ffbuild.ci verify-installed-sdk --report installed-sdk-tests.json
      - name: Verify and package installed vcpkg result
        if: ${{ true }}
        run: python -m ffbuild.ci worker-package
      - name: Validate extracted public SDK and CLI
        if: ${{ true }}
        run: python -m ffbuild.ci verify-sdk --artifacts-dir Release --report public-sdk-tests.json
      - name: Upload independent SDK acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: sdk-consumer-a${{ github.run_attempt }}-${{ matrix.id }}
          path: |
            installed-sdk-tests.json
            public-sdk-tests.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload installed license evidence on packaging failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: license-evidence-a${{ github.run_attempt }}-${{ matrix.id }}
          path: |
            ${{ steps.config.outputs.vcpkg_root }}/installed/vcpkg/status
            ${{ steps.config.outputs.vcpkg_root }}/installed/vcpkg/info/*.list
            ${{ steps.config.outputs.vcpkg_root }}/installed/*/share/*/copyright
            ${{ steps.config.outputs.vcpkg_root }}/installed/*/share/*/vcpkg.spdx.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload distribution and internal audit evidence
        uses: actions/upload-artifact@v6
        if: ${{ true }}
        with:
          name: ${{ matrix.id }}-a${{ github.run_attempt }}
          # Includes the internal *.audit.zip; only record.assets is published.
          path: |
            Release/*.zip
            Release/*.var.yaml
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-abi-worker-a${{ github.run_attempt }}-${{ matrix.id }}
          path: abi-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: build-logs-a${{ github.run_attempt }}-${{ matrix.yaml }}-${{ matrix.id }}
          path: |
            ${{ steps.config.outputs.vcpkg_root }}/buildtrees/**/*.log
            ${{ steps.config.outputs.vcpkg_root }}/buildtrees/**/*.err
          retention-days: 7
          if-no-files-found: ignore
