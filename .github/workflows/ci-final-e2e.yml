name: FFmpeg Final Candidate E2E

on:
  push:
    branches: [ci/e2e-final-20261125]

permissions:
  contents: read
  actions: read

concurrency:
  group: ffbuild-final-e2e
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a35ee4fb15686e49b0117ebc7637b1834adbd019
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - run: python -m ffbuild validate
      - run: python -m unittest discover -s tests
  smoke:
    needs: validate
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
    with:
      yaml: master
      dry_run: true
      skip_publish: true
      skip_release: false
      force: true
      shard_count: 1
      shard_index: 0

  report:
    needs: [validate, smoke]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Analyze actual Master matrix without repair delivery
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_RESULT: ${{ needs.smoke.result }}
        run: PYTHONPATH=. python tests/ci_master_behavior.py
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: ffbuild-master-behavior-a${{ github.run_attempt }}
          path: master-behavior/
          retention-days: 30
          if-no-files-found: error
