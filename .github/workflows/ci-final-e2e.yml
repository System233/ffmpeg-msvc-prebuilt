name: FFmpeg Final Candidate E2E

on:
  push:
    branches: [ci/e2e-final-20261125]

permissions:
  contents: read
  actions: read

concurrency:
  group: ffbuild-final-e2e
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a58da6d922995f7315c9b78486901f744f72b279
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - run: python -m ffbuild validate
      - run: python -m unittest discover -s tests
  smoke:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {yaml: '3.4.14', shard_index: 15}
          - {yaml: '5.1.10', shard_index: 10}
          - {yaml: '7.1.5', shard_index: 1}
          - {yaml: '9.1', shard_index: 4}
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
    with:
      yaml: ${{ matrix.yaml }}
      dry_run: true
      skip_publish: true
      skip_release: false
      force: true
      shard_count: 16
      shard_index: ${{ matrix.shard_index }}
