name: Scan for new FFmpeg releases

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Discover and create new version PRs
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GIT_AUTHOR_NAME: ffmpeg-dev[bot]
          GIT_AUTHOR_EMAIL: 295689149+ffmpeg-dev[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ffmpeg-dev[bot]
          GIT_COMMITTER_EMAIL: 295689149+ffmpeg-dev[bot]@users.noreply.github.com
        run: python -m ffbuild.updates --apply
