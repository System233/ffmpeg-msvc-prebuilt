name: Build All FFmpeg Versions

on:
  push:
    branches: [main]
    paths:
      - 'ffmpeg/**'
      - 'patches/**'
      - 'ports/**'
      - 'triplets/**'
      - 'scripts/**'
      - 'ffbuild/**'
      - 'vcpkg-configuration.json'
      - 'requirements.txt'
      - '.github/workflows/build-all.yml'
      - '.github/workflows/build-release.yml'
      - '.github/actions/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ffmpeg/**'
      - 'patches/**'
      - 'ports/**'
      - 'triplets/**'
      - 'scripts/**'
      - 'ffbuild/**'
      - 'vcpkg-configuration.json'
      - 'requirements.txt'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional FFmpeg version to build'
        type: string
      history:
        description: 'Include all historical versions (requires sharding if >256 jobs)'
        type: boolean
        default: false
      shard_count:
        description: 'Total shards for large historical matrices'
        type: number
        default: 1
      shard_index:
        description: 'Zero-based shard index'
        type: number
        default: 0

jobs:
  build:
    uses: ./.github/workflows/build-release.yml
    with:
      yaml: ${{ inputs.version || '' }}
      dry_run: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  all-checks-passed:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}
