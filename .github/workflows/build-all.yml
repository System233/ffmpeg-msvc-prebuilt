name: Build All FFmpeg Versions

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.scope.outputs.version }}
    steps:
      # The guard must be loaded from the trusted base, never the PR.
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'ffmpeg-dev[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'ffmpeg-dev[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          requirements: requirements.txt
      - name: Authenticate and scope automatic version PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'ffmpeg-dev[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        id: scope
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD"
          python -m ffbuild.release_trigger pr-gate --github-output
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - run: python -m ffbuild validate
      - run: python -m unittest discover -s tests

  build:
    needs: validate
    if: ${{ needs.validate.outputs.version != '' }}
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
    with:
      yaml: ${{ needs.validate.outputs.version }}
      dry_run: true
      force: true
      skip_publish: true

  all-checks-passed:
    needs: [validate, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require correct event-specific checks
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test "$VALIDATE_RESULT" = success
          if [[ -n "$VERSION" ]]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
