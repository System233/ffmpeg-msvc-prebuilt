name: Deploy GitHub Pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [web, data]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      compatible: ${{ steps.contract.outputs.compatible }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web
          path: web
      - uses: actions/checkout@v6
        with:
          ref: data
          path: web/data
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check catalog and frontend compatibility
        id: contract
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, existsSync, appendFileSync, readdirSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('web/package.json','utf8'));
          const frontendV2 = pkg.config?.catalogSchema === 2;
          const index = existsSync('web/data/index.json')
            ? JSON.parse(readFileSync('web/data/index.json','utf8')) : undefined;
          if (index && index.schema !== 2) throw Error('Unsupported catalog schema');
          const dataV2 = index?.schema === 2;
          if (!dataV2 && !readdirSync('web/data', {withFileTypes:true}).some(e => e.isDirectory() && /^\d+\.x$/.test(e.name))) throw Error('No usable catalog found');
          const compatible = frontendV2 === dataV2;
          const mode = frontendV2 ? 'v2' : 'legacy';
          if (!compatible) {
            console.log('::warning::Frontend and catalog schemas differ during cutover; the existing site is preserved.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Pages deployment intentionally skipped\nFrontend and data are on different catalog schemas. No artifact was published.\n');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `compatible=${compatible}\nmode=${mode}\n`);
          JS
      - uses: actions/checkout@v6
        if: steps.contract.outputs.compatible == 'true' && steps.contract.outputs.mode == 'v2'
        with:
          ref: main
          sparse-checkout: schema/v2
          path: contract
      - uses: pnpm/action-setup@v6
        if: steps.contract.outputs.compatible == 'true'
        with:
          version: 10.33.0
          package_json_file: web/package.json
      - name: Install dependencies
        if: steps.contract.outputs.compatible == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build V2 static catalog
        if: steps.contract.outputs.compatible == 'true' && steps.contract.outputs.mode == 'v2'
        working-directory: web
        env:
          BASE_URL: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SCHEMA_DIR: ../contract/schema/v2
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec tsx scripts/test-catalog.ts
          CATALOG_DIR=.generated/fixture-data CATALOG_FIXTURE=1 pnpm build
          CATALOG_FIXTURE=1 pnpm exec playwright test tests/e2e/native.spec.ts
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:e2e
      - name: Build legacy frontend
        if: steps.contract.outputs.compatible == 'true' && steps.contract.outputs.mode == 'legacy'
        working-directory: web
        env:
          BASE_URL: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        if: steps.contract.outputs.compatible == 'true' && steps.contract.outputs.mode == 'v2'
        with:
          path: web/build/client
      - uses: actions/upload-pages-artifact@v3
        if: steps.contract.outputs.compatible == 'true' && steps.contract.outputs.mode == 'legacy'
        with:
          path: web/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.compatible == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
