name: Dependency Submission

on:
  push:
    branches: [main]
    paths: ['vcpkg-configuration.json', 'ports/**', 'ffmpeg/**', 'ffbuild/**']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        triplet: [x64-windows, x86-windows, arm64-windows, arm-windows]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements.txt
      - name: Submit vcpkg dependency graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ffbuild.ci submit-dependencies --triplet "${{ matrix.triplet }}"
