name: Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - vcpkg-configuration.json
      - ports/**
      - ffmpeg/**
      - triplets/**
      - .github/ci.env
      - .github/workflows/build-release.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-vcpkg
        id: config
      - name: Submit vcpkg dependency graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ffbuild.ci submit-dependencies
