name: Restore legacy vcpkg cache
description: Restore at the original Actions cache path, then migrate without copying duplicate files
inputs:
  legacy-path:
    description: Original cache path used by the previous workflow
    required: true
  path:
    description: Current cache directory
    required: true
  prefix:
    description: Previous cache key prefix
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v5
      id: legacy
      with:
        path: ${{ inputs.legacy-path }}
        key: ${{ inputs.prefix }}migration
        restore-keys: ${{ inputs.prefix }}
    - name: Move restored files into current cache
      if: ${{ steps.legacy.outputs.cache-matched-key != '' }}
      shell: pwsh
      env:
        OLD_CACHE: ${{ inputs.legacy-path }}
        NEW_CACHE: ${{ inputs.path }}
      run: |
        $ErrorActionPreference = 'Stop'
        $source = (Get-Item -LiteralPath $env:OLD_CACHE).FullName
        $destination = [IO.Path]::GetFullPath($env:NEW_CACHE)
        New-Item -ItemType Directory -Force -Path $destination | Out-Null
        Get-ChildItem -LiteralPath $source -File -Recurse -Force | ForEach-Object {
          $relative = [IO.Path]::GetRelativePath($source, $_.FullName)
          $target = Join-Path $destination $relative
          if (-not (Test-Path -LiteralPath $target)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Move-Item -LiteralPath $_.FullName -Destination $target
          }
        }
        Remove-Item -LiteralPath $source -Recurse -Force
