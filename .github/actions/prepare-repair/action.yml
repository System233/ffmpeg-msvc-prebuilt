name: Prepare native repair environment
description: Bind the original source, restore exact native ABI dependencies and verify preparation
inputs:
  target:
    description: Authenticated failed FFmpeg version
    required: true
  cache-dir:
    description: Current binary cache directory
    required: true
  downloads-dir:
    description: Current source downloads directory
    required: true
outputs:
  base:
    description: Bound original commit
    value: ${{ steps.source.outputs.base }}
  context_sha256:
    description: Bound incident context digest
    value: ${{ steps.source.outputs.context_sha256 }}
  contract_sha256:
    description: Baseline feature and dependency contract digest
    value: ${{ steps.source.outputs.contract_sha256 }}
runs:
  using: composite
  steps:
    - name: Bind failed source and generate baseline ports
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_YAML: ${{ inputs.target }}
        CACHE_RECIPE: ${{ hashFiles('ports/**', '!ports/ffmpeg-tester/**', 'vcpkg-configuration.json') }}
      shell: pwsh
      run: python -m ffbuild autoheal prepare --triage autoheal-triage.json --yaml $env:TARGET_YAML --github-output
    - name: Restore shared dependency downloads
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.downloads-dir }}
        key: ${{ steps.source.outputs.download_key }}
        restore-keys: ${{ steps.source.outputs.download_prefix }}
    - name: Resolve repair cache plan
      id: cache-plan
      shell: pwsh
      env:
        REPAIR_TRIPLETS: ${{ steps.source.outputs.triplets }}
      run: python -m ffbuild.ci repair-cache-plan --triplets-env REPAIR_TRIPLETS
    - name: Restore native dependency cache 1
      if: fromJSON(steps.cache-plan.outputs.seeds)[0] != null
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ fromJSON(steps.cache-plan.outputs.seeds)[0].key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[0].key }}-
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[0].key }}
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[0].prefix }}
    - name: Restore native dependency cache 2
      if: fromJSON(steps.cache-plan.outputs.seeds)[1] != null
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ fromJSON(steps.cache-plan.outputs.seeds)[1].key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[1].key }}-
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[1].key }}
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[1].prefix }}
    - name: Restore native dependency cache 3
      if: fromJSON(steps.cache-plan.outputs.seeds)[2] != null
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ fromJSON(steps.cache-plan.outputs.seeds)[2].key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[2].key }}-
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[2].key }}
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[2].prefix }}
    - name: Restore native dependency cache 4
      if: fromJSON(steps.cache-plan.outputs.seeds)[3] != null
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ fromJSON(steps.cache-plan.outputs.seeds)[3].key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[3].key }}-
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[3].key }}
          ${{ fromJSON(steps.cache-plan.outputs.seeds)[3].prefix }}
    - name: Prepare MSVC and verify exact dependency cache coverage
      env:
        FFBUILD_REPAIR_TARGET: ${{ inputs.target }}
        FFBUILD_REPAIR_BASE: ${{ steps.source.outputs.base }}
        FFBUILD_REPAIR_CONTEXT_SHA256: ${{ steps.source.outputs.context_sha256 }}
        FFBUILD_REPAIR_CONTRACT_SHA256: ${{ steps.source.outputs.contract_sha256 }}
      shell: pwsh
      run: python -m ffbuild autoheal preflight
