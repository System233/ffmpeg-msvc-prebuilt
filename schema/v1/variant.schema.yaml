# =============================================================================
# Schema for .var.yaml files (produced by package_release.py)
# Schema version: 1
# =============================================================================
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ffmpeg-msvc-prebuilt.example/schema/v1/variant.schema.yaml"
title: "Variant YAML"
description: >
  Schema for .var.yaml files produced by package_release.py.
  One file per build variant.

type: object
required:
  - variant_id
  - version
  - arch
  - triplet
  - linkage
  - license
  - lts
  - ffmpeg_ref
  - build_date
  - assets
  - features
  - dependencies

properties:
  variant_id:
    type: string
    pattern: "^ffmpeg-"
    description: >
      Native records suffix the legacy variant ID with
      -a{12-digit native vcpkg ABI}; historical identifiers remain valid.

  publication_date:
    type: string
    format: date
    description: Release batch date when reusing an existing archive

  channel:
    enum: [release, master]

  package_format:
    type: integer
    minimum: 2

  compliance:
    type: object
    required: [package_count, packages, spdx_sha256, notices_sha256]
    properties:
      license_policy:
        type: integer
        minimum: 1
        description: Internal compatibility policy version; not a public filename suffix
      ffmpeg_license:
        type: string
        description: Actual GNU profile identified from FFmpeg copyright
      packages:
        type: array
        items:
          type: object
          properties:
            scope:
              enum: [target-candidate, build-only, system-dependency]
            license_expression:
              type: string
            license_source:
              type: string
            compatibility:
              type: object
              required: [status, selected, reasons]
              properties:
                status:
                  enum: [allow]
                selected:
                  type: array
                  items: {type: string}
                reasons:
                  type: array
                  items: {type: string}

  abi_hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: Native vcpkg ABI from the resolved install plan

  port:
    type: string
    pattern: '^ffmpeg(?:-|$)'

  expected_variants:
    type: integer
    minimum: 0

  version:
    type: string
    description: 'FFmpeg version (e.g. "8.1.1") or "master" for dev builds'

  source_commit:
    type: string
    pattern: '^[0-9a-f]{40}$'
    description: Pinned upstream commit for Master snapshots

  release_date:
    type: string
    format: date
    description: UTC date assigned by the release plan

  revision:
    type: integer
    description: vcpkg port revision number

  build_hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: Content hash of the source, patches, and dependency build recipe

  variant_hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: Build recipe hash, vcpkg Triplet and canonical Feature identity

  feature_hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: SHA256 of the requested vcpkg Package Spec and resolved Feature closure

  package_spec:
    type: string
    pattern: '^ffmpeg(?:-[a-z0-9-]+)?\['
    description: Version-qualified native vcpkg Package Spec

  arch:
    type: string
    enum: [x64, x86, arm64, arm]
    description: CPU architecture extracted from triplet

  triplet:
    type: string
    description: 'vcpkg triplet (e.g. "x64-windows", "x64-windows-mixed")'

  linkage:
    type: string
    enum: [shared, static]
    description: Library linkage type

  license:
    type: string
    enum: [lgpl, gpl, nonfree]
    description: License variant

  lts:
    type: boolean
    description: Whether this is an LTS release (odd major .1)

  ffmpeg_ref:
    type: string
    description: >
      FFmpeg git reference. Release: tag name ("n8.1.1").
      Master: git describe ("n8.0-1234-gabc").

  build_date:
    type: string
    format: date-time
    description: UTC timestamp of when the build was packaged

  assets:
    type: object
    description: Archives produced for this variant
    required: [binary]
    properties:
      binary:
        $ref: "#/$defs/asset_entry"
        description: Main binary distribution archive
      develop:
        $ref: "#/$defs/asset_entry"
        description: >
          SDK/develop archive (shared linkage only).
          Includes PDBs, debug libs, and extra headers.

  features:
    type: array
    items:
      type: string
    description: vcpkg features enabled for this build

  dependencies:
    type: array
    items:
      type: string
    description: vcpkg dependencies of this build

$defs:
  asset_entry:
    type: object
    description: A single distributable archive file
    required: [file, size, digest]
    properties:
      file:
        type: string
        description: Archive filename
      size:
        type: integer
        description: File size in bytes
      digest:
        type: string
        pattern: "^sha256:[a-f0-9]{64}$"
        description: SHA-256 checksum with algorithm prefix
