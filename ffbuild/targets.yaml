# CI selection is expressed in native vcpkg package specs. Feature and linkage
# decisions belong to vcpkg; ffbuild only schedules and fingerprints the result.
targets:
  - {package: 'ffmpeg[all-lgpl,static]', triplet: x64-windows}
  - {package: 'ffmpeg[all-gpl,static]', triplet: x64-windows}
  - {package: 'ffmpeg[all-lgpl]', triplet: x64-windows}
  - {package: 'ffmpeg[all-gpl]', triplet: x64-windows}
  - {package: 'ffmpeg[all-lgpl,static]', triplet: x86-windows}
  - {package: 'ffmpeg[all-gpl,static]', triplet: x86-windows}
  - {package: 'ffmpeg[all-lgpl]', triplet: x86-windows}
  - {package: 'ffmpeg[all-gpl]', triplet: x86-windows}
  - {package: 'ffmpeg[all-lgpl,static]', triplet: arm64-windows}
  - {package: 'ffmpeg[all-gpl,static]', triplet: arm64-windows}
  - {package: 'ffmpeg[all-lgpl]', triplet: arm64-windows}
  - {package: 'ffmpeg[all-gpl]', triplet: arm64-windows}
  - {package: 'ffmpeg[all-lgpl,static]', triplet: arm-windows}
  - {package: 'ffmpeg[all-gpl,static]', triplet: arm-windows}
  - {package: 'ffmpeg[all-lgpl]', triplet: arm-windows}
  - {package: 'ffmpeg[all-gpl]', triplet: arm-windows}
